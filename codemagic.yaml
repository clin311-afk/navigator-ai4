workflows:
  navigator-ai-android:
    name: Navigator AI Android Build
    instance_type: mac_mini_m1  # Sneller dan Linux voor mobile builds
    max_build_duration: 30
    
    environment:
      flutter: stable
      xcode: latest
      android_sdk: "\$ANDROID_SDK_ROOT"
      
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
        
      - name: Build Android APK
        script: flutter build apk --debug
        
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
    publishing:
      email:
        recipients:
          - your-email@example.com  # VERVANG DIT MET JE EIGEN EMAIL
        notify:
          success: true
          failure: true